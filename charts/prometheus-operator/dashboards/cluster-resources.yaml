kind: Dashboard
metadata:
  project: odg
  name: cluster-resources
  title: Cluster resources
spec:
  panels:
    cpu-usage:
      kind: Panel
      spec:
        display:
          name: CPU usage (cores)
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (namespace) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))
    memory-usage:
      kind: Panel
      spec:
        display:
          name: Memory usage
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: bytes
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (namespace) (container_memory_working_set_bytes{container!=""})
    pods-by-phase:
      kind: Panel
      spec:
        display:
          name: Pods by state
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (phase) (kube_pod_status_phase)
    deployments-unavailable:
      kind: Panel
      spec:
        display:
          name: Deployments unavailable replicas
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (namespace, deployment) (kube_deployment_status_replicas_unavailable)
  layouts:
  - kind: Grid
    spec:
      display:
        title: ''
      items:
      - x: 0
        y: 0
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/cpu-usage'
      - x: 12
        y: 0
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/memory-usage'
      - x: 0
        y: 6
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/pods-by-phase'
      - x: 12
        y: 6
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/deployments-unavailable'
  duration: 1h
