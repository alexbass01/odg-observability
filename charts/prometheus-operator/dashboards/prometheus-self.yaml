kind: Dashboard
metadata:
  project: odg
  name: prometheus-self
  title: Prometheus self-monitoring
spec:
  panels:
    scrape-targets-up:
      kind: Panel
      spec:
        display:
          name: Scrape targets up
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: sum by (job) (up)
    scrape-duration:
      kind: Panel
      spec:
        display:
          name: Scrape duration
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: seconds
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: avg by (job) (scrape_duration_seconds)
    head-series:
      kind: Panel
      spec:
        display:
          name: Head series
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: prometheus_tsdb_head_series
    samples-ingested:
      kind: Panel
      spec:
        display:
          name: Samples ingested /s
        plugin:
          kind: TimeSeriesChart
          spec:
            yAxis:
              format:
                unit: decimal
        queries:
        - kind: TimeSeriesQuery
          spec:
            plugin:
              kind: PrometheusTimeSeriesQuery
              spec:
                datasource:
                  kind: PrometheusDatasource
                  name: prometheus
                query: rate(prometheus_tsdb_head_samples_appended_total[5m])
  layouts:
  - kind: Grid
    spec:
      display:
        title: ''
      items:
      - x: 0
        y: 0
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/scrape-targets-up'
      - x: 12
        y: 0
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/scrape-duration'
      - x: 0
        y: 6
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/head-series'
      - x: 12
        y: 6
        width: 12
        height: 6
        content:
          $ref: '#/spec/panels/samples-ingested'
  duration: 1h
