host: ~

# image property will be set during release
image:
  repository: ~
  tag: ~

prometheus:
  image:
    repository: ~
    tag: ~

prometheus-config-reloader:
  image:
    repository: ~
    tag: ~

scrapeInterval: 15s

alertmanager:
  enabled: false
  image:
    repository: ~
    tag: ~
  slack:
    enabled: false
    apiURL: https://slack.com/api/chat.postMessage
    channel: ~
    token: ~
    title: |-
      [{{ "{{" }} .Status | toUpper {{ "}}" }}{{ "{{" }} if eq .Status "firing" {{ "}}" }}:{{ "{{" }} .Alerts.Firing | len {{ "}}" }}{{ "{{" }} end {{ "}}" }}] {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
    text: |-
      {{ "{{" }} range .Alerts {{ "}}" }}*Alert:* {{ "{{" }} .Annotations.summary {{ "}}" }}{{ "{{" }} if .Annotations.description {{ "}}" }}
      *Description:* {{ "{{" }} .Annotations.description {{ "}}" }}{{ "{{" }} end {{ "}}" }}
      *Severity:* {{ "{{" }} .Labels.severity {{ "}}" }}
      *Namespace:* {{ "{{" }} .Labels.namespace {{ "}}" }}
      {{ "{{" }} end {{ "}}" }}


# kube-state-metrics subchart configuration (see
# https://artifacthub.io/packages/helm/prometheus-community/kube-state-metrics)
kube-state-metrics:
  image:
    # When repository is set (by OCM relocation), the kube-state-metrics.image helper override
    # in templates/helpers.tpl treats it as a flat "host/path/image" reference (same pattern
    # as the other images in this chart). Empty string means "not set" — the helper then falls
    # back to KSM's native registry+repository assembly so upstream defaults still work.
    repository: ""
    tag: ~
    # Explicit default so the fallback registry/repository assembly still works when
    # repository is unset. Must match the KSM subchart's own default.
    registry: registry.k8s.io
  # labels on the Service so our own ServiceMonitor (templates/servicemonitors.yaml)
  # can select it
  customLabels:
    monitoring: prometheus
  prometheus:
    monitor:
      # we create our own ServiceMonitor (see this chart's templates/)
      enabled: false
  # watch only the namespace this chart is deployed into; set to false to watch all namespaces
  releaseNamespace: true
  # keep namespace-scoped collectors minimal; drop cluster-wide resources not needed for pod health
  collectors:
    - pods
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
    - jobs
    - cronjobs

# Master switch for perses. When disabled, the entire perses-app block below and the
# templates/perses{,-dashboards}.yaml manifests are skipped (the dashboard files under
# dashboards/ become inert). Enable after first installing with CRDs, since its
# ServiceMonitor targets CRDs from crds/.
perses:
  enabled: false

# Master switch for perses. When disabled, the entire perses-app block below and the
# templates/perses{,-dashboards}.yaml manifests are skipped (the dashboard files under
# dashboards/ become inert).
perses:
  enabled: false

# perses subchart configuration (see https://artifacthub.io/packages/helm/perses/perses).
# The subchart is referenced with the alias `perses-app` in Chart.yaml because its
# values.schema.json rejects the release-time keys the other images in this chart use
# (image.repository / image.tag as a flat "host/path/image" + tag). Unlike the other images,
# the subchart templates its image inline (no image helper the parent could override like it
# does for kube-state-metrics), so we cannot inject OCM's flat "host/path/image" repository —
# only the tags are remapped (see .github/workflows/build.yaml ocm-mappings).
perses-app:
  image:
    # keep these matching the subchart defaults; OCM relocation only overwrites the tag
    # (defaults match the ociImage entries in .ocm/base-component.yaml)
    registry: docker.io
    name: persesdev/perses
    # version: defaults to the chart appVersion (v0.54.0 for chart 0.23.3); overwritten by OCM
  # the sidecar watches ConfigMaps labeled perses.dev/resource: "true" in this namespace
  # and drops them into /etc/perses/provisioning, where perses picks them up (dashboards from
  # dashboards/*.yaml via templates/perses-dashboards.yaml, datasource in
  # templates/perses.yaml); the chart is CRD-less — PersesDashboard CRDs belong to the
  # separate perses-operator project
  sidecar:
    enabled: true
    # only watch our own namespace
    allNamespaces: false
    image:
      # defaults match the subchart; OCM relocation only overwrites the tag
      registry: docker.io
      repository: kiwigrid/k8s-sidecar
      tag: 2.13.3  # overwritten by OCM
    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 128Mi
  # labels on the Service so our own ServiceMonitor (templates/servicemonitors.yaml)
  # can select it
  service:
    labels:
      monitoring: prometheus
  # perses is stateful: dashboards/datasources live in a file DB on a PVC
  persistence:
    enabled: true
  config:
    provisioning:
      folders:
        - /etc/perses/provisioning
      interval: 10m
    security:
      enable_auth: false
      readonly: false
  resources:
    # memory: dashboards, cached provisioning + file-DB state in memory
    # cpu: dashboard queries proxy Prometheus, so requests matter; no limits so it can burst
    requests:
      memory: 256Mi
      cpu: 50m
    limits:
      memory: 512Mi
  testFramework:
    # the chart ships helm-test hooks; we don't run `helm test`, and `helm template` would
    # apply them as regular pods otherwise
    enabled: false
