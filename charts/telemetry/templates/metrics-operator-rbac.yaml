{{- if .Values.metrics.backlogItem }}
# Extra RBAC so the bundled metrics-operator can enumerate the backlogitems CRD
# when a Metric CR targets it. BacklogItem is namespaced (odg-core
# charts/extensions/crds/backlog-item.yaml: scope: Namespaced), so a plain Role
# in observedNamespace suffices — the Metric CRs only target that namespace.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-operator-backlogitems
  namespace: {{ .Values.observedNamespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
rules:
  - apiGroups: ["odg.open-delivery-gear.ocm.software"]
    resources: ["backlogitems"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-operator-backlogitems
  namespace: {{ .Values.observedNamespace }}
  labels:
    {{- include "telemetry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-operator-backlogitems
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-metrics-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
