name: prometheus-operator
installation:
  ocm_references:
    - helm_chart_name: prometheus-operator
      name: ocm.software/open-delivery-gear/observability
      version: 0.36.0-dev
      artefact:
        name: prometheus-operator
        version: 0.36.0-dev
      mappings:
        - name: prometheus-operator
          version: 0.36.0-dev
          artefact_type: helmchart-imagemap
  value_templates:
    - helm_chart_name: prometheus-operator
      helm_attribute: host
      value: prometheus.${base_url}
      value_type: python-string-template
outputs: []
dependencies: []

---

name: telemetry
installation:
  ocm_references:
    - helm_chart_name: telemetry
      name: ocm.software/open-delivery-gear/observability
      version: 0.36.0-dev
      artefact:
        name: telemetry
        version: 0.36.0-dev
      mappings:
        - name: telemetry
          version: 0.36.0-dev
          artefact_type: helmchart-imagemap
  value_templates:
    - helm_chart_name: telemetry
      helm_attribute: observedNamespace
      value: ${target_namespace}
      value_type: python-string-template
    - helm_chart_name: telemetry
      helm_attribute: backend
      value: ${telemetry_backend}
      value_type: python-string-template
      default: debug
outputs: []
dependencies: []

